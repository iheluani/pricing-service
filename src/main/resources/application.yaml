server:
  port: 8080

logging:
  level:
    org.springframework.boot.autoconfigure: INFO

spring:
  application:
    name: pricing-service

  cache:
    type: simple

  datasource:
    url: jdbc:h2:mem:pricingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console
